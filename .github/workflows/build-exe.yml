name: Build Windows app

# Publish a new version: Actions tab → "Build Windows app" → Run workflow → type a version.
#   Beta / demo builds: v0.2.0-beta   → shown on GitHub as a "Pre-release"
#   Full release:       v1.0.0        → shown as the latest release
# (Pushing a tag like v0.2.0-beta also works.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (beta: v0.2.0-beta, full release: v1.0.0)"
        required: true
        default: "v0.1.0-beta"

permissions:
  contents: write

env:
  APP_NAME: Blipville

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Build the .exe
        run: pyinstaller --onefile --noconsole --name ${{ env.APP_NAME }} --icon assets/icon.ico blip.pyw

      - name: Smoke test (the app starts and keeps running)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/$env:APP_NAME.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "The app closed right away (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4.4.3
        with:
          name: windows-app
          path: dist/*.exe

      - name: Attach to the release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Blipville ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.event.inputs.version || github.ref_name, '-') || startsWith(github.event.inputs.version || github.ref_name, 'v0') }}
          files: dist/*.exe
          generate_release_notes: true

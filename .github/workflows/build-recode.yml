name: Build Blipville Recode

# Blipville Recode (the Qt rebuild of the desktop app). To publish a new build, edit RECODE_VERSION and commit it,
# or run this workflow by hand from the Actions tab. Every run saves its logs to the "ci-logs" branch.
on:
  push:
    branches: [main]
    paths: ["RECODE_VERSION", ".github/workflows/build-recode.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Work out the version
        id: ver
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          $v = (Get-Content RECODE_VERSION -Raw).Trim()
          if ($v -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Not a version: '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "version $v, commit $env:GITHUB_SHA" | Out-File logs/summary.txt

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install PyInstaller and Qt
        run: pip install pyinstaller==6.11.1 PySide6-Essentials==6.8.1 2>&1 | Tee-Object -FilePath logs/1-install.txt

      - name: Export the art and stamp the version
        run: |
          python tools/export_recode_data.py 2>&1 | Tee-Object -FilePath logs/2-export.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/stamp_version.py ${{ steps.ver.outputs.version }} recode/blipville_recode.py 2>&1 | Tee-Object -FilePath logs/2-export.txt -Append

      - name: Build the .exe
        run: >
          pyinstaller --onefile --noconsole --name Blipville-Recode --icon assets/icon.ico
          --add-data "recode/blipdata.json;."
          --exclude-module tkinter --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest
          recode/blipville_recode.py 2>&1 | Tee-Object -FilePath logs/3-build.txt

      - name: Smoke test (the app starts and keeps running)
        run: |
          $p = Start-Process -FilePath "dist/Blipville-Recode.exe" -PassThru
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          "still running after 15 s: $alive (exit code $($p.ExitCode))" | Tee-Object -FilePath logs/4-smoke.txt
          Copy-Item "$env:APPDATA\Blipville\blipville-recode.log" logs/4-app-log.txt -ErrorAction SilentlyContinue
          if (-not $alive) { throw "The app closed right away" }
          Stop-Process -Id $p.Id -Force
          "size: $((Get-Item dist/Blipville-Recode.exe).Length)" | Out-File logs/4-smoke.txt -Append

      - name: Attach to the release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Blipville Recode ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/*.exe
          body_path: recode/RELEASE_NOTES.md

      - name: Save the logs to the ci-logs branch
        if: always()
        run: |
          "result: ${{ job.status }}" | Out-File logs/summary.txt -Append
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $dest = "recode-$(Get-Date -Format yyyyMMdd-HHmmss)"
          git fetch origin ci-logs 2>$null
          git switch --orphan ci-logs-tmp
          git rm -rf --cached . 2>$null | Out-Null
          if (git ls-remote --heads origin ci-logs) { git checkout origin/ci-logs -- . 2>$null }
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item logs/* $dest/
          git add $dest
          git commit -m "Build logs: $dest (${{ job.status }})" | Out-Null
          git push origin HEAD:ci-logs

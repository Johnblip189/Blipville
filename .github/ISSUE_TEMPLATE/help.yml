name: 🆘 Get help
description: Stuck, confused, or something isn't working the way you expected? Ask here.
title: "[Help] "
labels: ["help"]
body:
  - type: markdown
    attributes:
      value: "Please don't post personal info (like your email or address) here: this page is public."
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: What were you trying to do, and what happened? Screenshots help a lot!
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Which Blipville?
      options:
        - The desktop app (Blipville.exe)
        - The phone / browser version (On the Go)
        - Running blip.pyw with Python

name: Build Blipville Redux

# Blipville Redux: the same game as Blipville (blip.pyw), with a new way of drawing the pets (real see-through windows,
# no black flashes). To publish a new build, edit REDUX_VERSION and commit it, or run this workflow by hand.
# Every run clicks a pet, takes screenshots and saves them with the logs to the "ci-logs" branch.
on:
  push:
    branches: [main]
    paths: ["REDUX_VERSION", ".github/workflows/build-redux.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Work out the version
        id: ver
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          $v = (Get-Content REDUX_VERSION -Raw).Trim()
          if ($v -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Not a version: '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "version $v, commit $env:GITHUB_SHA" | Out-File logs/summary.txt

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install PyInstaller and Pillow
        run: pip install pyinstaller==6.11.1 pillow==11.0.0 2>&1 | Tee-Object -FilePath logs/1-install.txt

      - name: Stamp the version and the edition
        run: python tools/stamp_version.py ${{ steps.ver.outputs.version }} --edition redux 2>&1 | Tee-Object -FilePath logs/2-stamp.txt

      - name: Build the .exe
        run: >
          pyinstaller --onefile --noconsole --name Blipville-Redux --icon assets/icon.ico
          --hidden-import PIL.ImageFont --hidden-import PIL.ImageDraw
          blip.pyw 2>&1 | Tee-Object -FilePath logs/3-build.txt

      - name: Test on Windows (starts, pets are see-through, clicks reach them)
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace W -Name U -MemberDefinition @'
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, System.UIntPtr e);
          '@
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(40, 120, 80))
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size,
              [System.Drawing.CopyPixelOperation]::SourceCopy -bor [System.Drawing.CopyPixelOperation]::CaptureBlt)
            $bmp.Save("logs/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $log = "$env:APPDATA\Blipville\blipville-redux.log"
          $env:BLIPVILLE_SELFTEST = "1"
          $env:BLIPVILLE_NO_MAINTENANCE = "1"
          $p = Start-Process -FilePath "dist/Blipville-Redux.exe" -PassThru
          Start-Sleep -Seconds 4
          Shot "4a-after-4s"
          Start-Sleep -Seconds 7
          $alive = -not $p.HasExited
          "still running after 11 s: $alive (exit code $($p.ExitCode))" | Tee-Object -FilePath logs/4-test.txt
          if ($alive) {
            $line = Get-Content $log -ErrorAction SilentlyContinue | Select-String "click_at=(\d+),(\d+)" | Select-Object -First 1
            if ($line) {
              $x = [int]$line.Matches[0].Groups[1].Value; $y = [int]$line.Matches[0].Groups[2].Value
              "clicking a pet at $x,$y" | Tee-Object -FilePath logs/4-test.txt -Append
              [W.U]::SetCursorPos($x, $y) | Out-Null; Start-Sleep -Milliseconds 300
              [W.U]::mouse_event(0x2, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 120
              [W.U]::mouse_event(0x4, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 700
              Shot "4b-after-click"
              [W.U]::mouse_event(0x8, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 120
              [W.U]::mouse_event(0x10, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 1200
              Shot "4c-menu-open"
              [System.Windows.Forms.SendKeys]::SendWait("{ESC}"); Start-Sleep -Milliseconds 800
              Shot "4d-menu-closed"
            } else { "no pet position in the log" | Tee-Object -FilePath logs/4-test.txt -Append }
            Start-Sleep -Seconds 2
            $alive = -not $p.HasExited
            "still running after the clicks: $alive" | Tee-Object -FilePath logs/4-test.txt -Append
          }
          Copy-Item $log logs/4-app-log.txt -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $text = Get-Content logs/4-app-log.txt -Raw -ErrorAction SilentlyContinue
          if (-not $alive) { throw "The app closed by itself" }
          if ($text -notmatch "layered=True") { throw "The pet windows didn't become see-through layered windows" }
          if ($text -match "failed=True") { throw "Windows refused to show a layered window" }
          if ($text -notmatch "selftest: pressed") { throw "The click didn't reach the pet" }
          "size: $((Get-Item dist/Blipville-Redux.exe).Length)" | Out-File logs/4-test.txt -Append

      - name: Attach to the release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Blipville Redux ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/Blipville-Redux.exe
          body_path: redux/RELEASE_NOTES.md

      - name: Save the logs and screenshots to the ci-logs branch
        if: always()
        run: |
          "result: ${{ job.status }}" | Out-File logs/summary.txt -Append
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $dest = "redux-$(Get-Date -Format yyyyMMdd-HHmmss)"
          git fetch origin ci-logs 2>$null
          git switch --orphan ci-logs-tmp
          git rm -rf --cached . 2>$null | Out-Null
          if (git ls-remote --heads origin ci-logs) { git checkout origin/ci-logs -- . 2>$null }
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item logs/* $dest/
          git add $dest
          git commit -m "Build logs: $dest (${{ job.status }})" | Out-Null
          git push origin HEAD:ci-logs

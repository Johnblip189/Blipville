name: Build Windows app

# Three ways to publish a new version:
#   1. Edit the VERSION file on main (e.g. v0.3.0-beta) and commit it.  ← easiest
#   2. Actions tab → "Build Windows app" → Run workflow → type a version.
#   3. Push a tag like v0.3.0-beta.
# Versions starting with v0 or containing "-" (like -beta) are shown on GitHub as a "Pre-release";
# v1.0.0 and up are full releases.
on:
  push:
    branches: [main]
    paths: ["VERSION"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (beta: v0.2.0-beta, full release: v1.0.0)"
        required: true
        default: "v0.2.0-beta"

permissions:
  contents: write

env:
  APP_NAME: Blipville

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" }
          if (-not $v) { $v = (Get-Content VERSION -Raw).Trim() }
          if ($v -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Not a version: '$v' (use something like v0.2.0-beta)" }
          $pre = ($v.StartsWith("v0") -or $v.Contains("-")).ToString().ToLower()
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $v (pre-release: $pre)"

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Build the .exe
        run: pyinstaller --onefile --noconsole --name ${{ env.APP_NAME }} --icon assets/icon.ico blip.pyw

      - name: Smoke test (the app starts and keeps running)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/$env:APP_NAME.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "The app closed right away (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4.4.3
        with:
          name: windows-app
          path: dist/*.exe

      - name: Attach to the release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Blipville ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          files: dist/*.exe
          generate_release_notes: true

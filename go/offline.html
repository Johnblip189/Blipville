<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blipville is napping</title>
<meta name="theme-color" content="#211c38">
<style>
  :root { --bg: #211c38; --text: #f1edff; --muted: #b8b2d8; --gold: #ffd666; --accent: #7a5cff;
          --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  main { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 24px) 16px 32px; text-align: center; }
  img { width: 100%; height: auto; border-radius: 18px; image-rendering: pixelated; display: block; }
  h1 { font-size: 26px; margin: 22px 0 8px; }
  p { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 6px 0; }
  .gold { color: var(--gold); font-weight: 700; }
  button { margin-top: 20px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 14px; background: var(--accent);
           color: #fff; font: 800 16px var(--font); }
</style>
</head>
<body>
<main>
  <img src="icons/server-down.png" alt="A Blip asleep on top of an unplugged server while a husky Blip looks at the plug">
  <h1>Blipville is napping 💤</h1>
  <p>We can't reach the Blipville servers right now. We'll be back soon!</p>
  <p class="gold">Your pets are safe. They're saved on this phone.</p>
  <p>The desktop app doesn't need the internet, so it still works.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>

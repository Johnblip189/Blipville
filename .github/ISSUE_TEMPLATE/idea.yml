name: 💡 Suggest an idea
description: A new feature, minigame, hat, cryptid, kaiju… anything you'd like to see in Blipville.
title: "[Idea] "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's your idea?
      description: Tell me what you'd like to see. Drawings and screenshots are welcome!
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be fun? (optional)

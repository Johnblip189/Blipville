# The maintenance switch for Blipville: On the Go.
# On GitHub: Actions → "Maintenance mode" → Run workflow → pick on/off (and a message) → Run.
# It updates go/status.json, which the phone version checks every couple of minutes.
name: Maintenance mode

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Turn maintenance mode on or off"
        type: choice
        options: ["on", "off"]
        default: "on"
      message:
        description: "Message for players (optional)"
        type: string
        default: "We're fixing things up. Back soon!"

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update go/status.json
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
        run: |
          python3 - <<'PY'
          import json, os
          on = os.environ["MODE"] == "on"
          data = {"maintenance": on, "message": os.environ.get("MESSAGE", "").strip() if on else ""}
          with open("go/status.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print(data)
          PY
      - name: Save it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/status.json
          git diff --cached --quiet && echo "Already set." && exit 0
          git commit -m "Maintenance mode: ${{ inputs.mode }}"
          git push

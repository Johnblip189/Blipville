name: Update the site
# GitHub Pages builds from the "site" branch; this copies main onto it after every push.
# A push made with the workflow's own token doesn't start a Pages build by itself, so we ask for one.
# What GitHub says about the site (its settings and the last build) is saved to the ci-logs branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:refs/heads/site
      - name: Ask GitHub Pages to rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pages
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          echo "== settings before" > /tmp/pages/log.txt
          api "https://api.github.com/repos/${{ github.repository }}/pages" >> /tmp/pages/log.txt
          echo "== request a build" >> /tmp/pages/log.txt
          api -X POST "https://api.github.com/repos/${{ github.repository }}/pages/builds" >> /tmp/pages/log.txt
          sleep 60
          echo "== latest build (a minute later)" >> /tmp/pages/log.txt
          api "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest" >> /tmp/pages/log.txt
          cat /tmp/pages/log.txt
      - name: Save what GitHub said to the ci-logs branch
        if: always()
        run: |
          dest="pages-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs && git checkout -f -B ci-logs-tmp FETCH_HEAD
          mkdir -p "$dest" && cp /tmp/pages/log.txt "$dest/" 2>/dev/null || echo "no log" > "$dest/log.txt"
          git add "$dest" && git commit -qm "Pages logs: $dest"
          for i in 1 2 3; do git push origin HEAD:ci-logs && break; git pull --rebase origin ci-logs; sleep 3; done

name: 🐛 Something's broken
description: A pet is acting weird, crashing, or won't start.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong? Screenshots help a lot!
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Your computer
      placeholder: e.g. Windows 11, Python 3.12
